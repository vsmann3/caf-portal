services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: caf_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafapp -d caf_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cafapp:${POSTGRES_PASSWORD}@db:5432/caf_portal?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -hex 32)}
      APP_URL: ${APP_URL:-http://localhost:3000}
      STORAGE_DEFAULT: local
      LOCAL_STORAGE_PATH: /app/storage
      RUN_SEED: ${RUN_SEED:-0}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-superadmin@example.com}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-ChangeMe@123}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - document-storage:/app/storage

volumes:
  pgdata:
  document-storage:
